[package]
name = "fujimod-xm1"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "AGPL-3.0-only"

[[bin]]
name = "fujimod-xm1"
path = "src/main.rs"

# build-support/fujimod-xm1.nix places FujiMod's source at ../fujimod.
[dependencies]
fujimod-catalog = { path = "../fujimod/crates/catalog" }
fujimod-emulator = { path = "../fujimod/crates/emulator" }
fujimod-emulator-cpu = { path = "../fujimod/crates/emulator-cpu" }
fujimod-emulator-exr2-board = { path = "../fujimod/crates/emulator-exr2-board" }
fujimod-emulator-exr2-plan = { path = "../fujimod/crates/emulator-exr2-plan" }
fujimod-emulator-models = { path = "../fujimod/crates/emulator-models" }
fujimod-recording = { path = "../fujimod/crates/recording" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"

[workspace]
