[package]
name = "fujimod-xm1"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "AGPL-3.0-only"

[lib]
path = "src/lib.rs"

[[bin]]
name = "fujimod-xm1"
path = "src/main.rs"

[[bin]]
name = "fujimod-xm1-ram-push"
path = "src/ram_push.rs"

[[bin]]
name = "fujimod-xm1-toggle"
path = "src/toggle.rs"

[[bin]]
name = "fujimod-xm1-provenance"
path = "src/provenance_main.rs"

[[bin]]
name = "fujimod-xm1-updater"
path = "src/updater.rs"

[[bin]]
name = "fujimod-xm1-queue-boundary"
path = "src/queue_boundary.rs"

# build-support/fujimod-xm1.nix places FujiMod's source at ../fujimod.
[dependencies]
fujimod-catalog = { path = "../fujimod/crates/catalog" }
fujimod-emulator = { path = "../fujimod/crates/emulator" }
fujimod-emulator-cpu = { path = "../fujimod/crates/emulator-cpu" }
fujimod-emulator-devices = { path = "../fujimod/crates/emulator-devices" }
fujimod-emulator-ip = { path = "../fujimod/crates/emulator-ip" }
fujimod-emulator-exr2-system = { path = "../fujimod/crates/emulator-exr2-system" }
fujimod-emulator-exr2-board = { path = "../fujimod/crates/emulator-exr2-board" }
fujimod-emulator-exr2-plan = { path = "../fujimod/crates/emulator-exr2-plan" }
fujimod-emulator-models = { path = "../fujimod/crates/emulator-models" }
fujimod-recording = { path = "../fujimod/crates/recording" }
flate2 = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"

[workspace]
