[package]
name = "x70-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "=0.29.3", features = ["abi3-py310"] }
libloading = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
