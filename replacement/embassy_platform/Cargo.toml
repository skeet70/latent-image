[package]
name = "xm1-embassy-platform"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[lib]
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]

[features]
default = ["counter-down"]
# counter-up for the camera, counter-down for the pinned FujiMod model.
counter-up = []
counter-down = []
# Refusal controls for the emulator demonstration.
control-no-pender-kernel = []
control-no-executors = []

[dependencies]
critical-section = { version = "1.2", features = ["restore-state-bool"] }
embassy-executor = { version = "=0.10.0" }
embassy-time = { version = "0.5", features = ["tick-hz-3_000_000"] }
embassy-time-driver = { version = "0.2" }
embassy-time-queue-utils = { version = "0.3" }

[profile.release]
opt-level = "z"
debug = false
panic = "abort"
codegen-units = 1
lto = true
